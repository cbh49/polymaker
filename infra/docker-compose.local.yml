# Local stand-in for the EC2 systemd units.
# From trading-bot/:
#   docker compose -f infra/docker-compose.local.yml up --build
#
# Keep POLYMAKER_LIVE unset/0 in .env. This still scrapes, matches, and
# logs would-buys; it will not send CLOB orders.
services:
  monitor:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: polymaker:local
    container_name: polymaker-monitor-local
    restart: unless-stopped
    env_file:
      - ../.env
    working_dir: /app
    volumes:
      - ../.env:/app/.env:ro
      - ../journal:/app/journal
      - ../logs:/app/logs
      - ../data-aggregation/output:/app/data-aggregation/output
      - ../poly-sharp-finder/signals:/app/poly-sharp-finder/signals
      - ../poly-sharp-finder/intents:/app/poly-sharp-finder/intents
      - ../poly-sharp-finder/watch_list.json:/app/poly-sharp-finder/watch_list.json
      - ../state.db:/app/state.db
    command:
      - python
      - scripts/run_monitor.py
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  sharp-loop:
    image: polymaker:local
    container_name: polymaker-sharp-local
    restart: unless-stopped
    depends_on:
      - monitor
    env_file:
      - ../.env
    working_dir: /app
    volumes:
      - ../.env:/app/.env:ro
      - ../journal:/app/journal
      - ../logs:/app/logs
      - ../data-aggregation/output:/app/data-aggregation/output
      - ../poly-sharp-finder/signals:/app/poly-sharp-finder/signals
      - ../poly-sharp-finder/intents:/app/poly-sharp-finder/intents
      - ../poly-sharp-finder/watch_list.json:/app/poly-sharp-finder/watch_list.json
      - ../state.db:/app/state.db
    command:
      - python
      - scripts/run_sharp_loop.py
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
